<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">U-Ray — свой язык. Свои нейросети.</title>
  <desc id="desc">Social preview for U-Ray, an interpreted programming language with built-in machine-learning tools.</desc>
  <defs>
